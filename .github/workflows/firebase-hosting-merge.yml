name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Sanitize and Set Firebase Service Account
        id: sa
        env:
          SA1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARB_SOQ }}
          SA2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARB_SOOQ }}
        run: |
          node -e '
            const fs = require("fs");
            const raw = (process.env.SA1 || process.env.SA2 || "").trim();
            let parsed;
            try {
              parsed = JSON.parse(raw);
            } catch (e) {
              const start = raw.indexOf("{");
              const end = raw.lastIndexOf("}");
              if (start !== -1 && end !== -1 && end > start) {
                parsed = JSON.parse(raw.substring(start, end + 1));
              } else {
                throw new Error("Could not parse Firebase Service Account JSON: " + e.message);
              }
            }
            const cleanJson = JSON.stringify(parsed);
            const delimiter = "EOF_" + Date.now();
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `service_account<<${delimiter}\n${cleanJson}\n${delimiter}\n`);
          '
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ steps.sa.outputs.service_account }}
          channelId: live
          projectId: arb-soq
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
