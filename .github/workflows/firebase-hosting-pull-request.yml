# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Set Firebase Service Account
        id: sa
        env:
          SA1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARB_SOQ }}
          SA2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARB_SOOQ }}
        run: |
          if [ -n "$SA1" ]; then
            echo "service_account<<EOF" >> $GITHUB_OUTPUT
            echo "$SA1" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "service_account<<EOF" >> $GITHUB_OUTPUT
            echo "$SA2" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ steps.sa.outputs.service_account }}
          projectId: arb-soq
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
